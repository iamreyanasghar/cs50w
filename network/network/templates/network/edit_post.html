{% extends "network/layout.html" %}

{% block body %}

   <script>
       document.addEventListener('DOMContentLoaded', () => {

	   document.querySelector('form').addEventListener('submit', function(event) {
		event.preventDefault();

		const formData = new FormData(this);
		console.log(formData)

			      fetch(`/edit_post/{{ post.id }}`, {
		method: 'POST',
		body: formData
		}).then(response => response.text())
		  .then(data => console.log('Form submitted successfully:', data))
		  .catch(error => console.error('Submission failed:', error));
	  });
	});


   </script>
   {% if user.is_authenticated %}
      <div id="new_post">
         <h2>Edit Post:</h2>

         <form action="{% url 'edit_post' post.id %}" method="post">
            {% csrf_token %}

	    <textarea name="new_post" id="new_post">{{ post.content }}</textarea>
            <br>
            <button type="submit" id="submit_post">Post</button>
         </form>
      </div>
   {% endif %}

{% endblock %}
