{% extends "network/layout.html" %}

{% block body %}


<div class="all_posts">
   {% for post in posts %}
      <div class="post">
         <h4 class="post_content"><a href="{% url 'profile' post.user.id %}">{{post.user}}</a></h4>
         <h6 class="post_content">{{post.content}}</h6>
         <p class="card-text text-muted small post_content">{{post.date}}</p>
      </div>
   {% endfor %}
</div>


{% endblock %}
