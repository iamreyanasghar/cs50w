{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - {{ title }}
{% endblock %}

{% block body %}

   <form method="POST">
        {% csrf_token %}

        <label for="head">Title:</label>
        <input type="text" name="head" placeholder="Title for Page"><br><br>

        <textarea name="content"></textarea><br>

        <button type="submit">Submit</button>
   </form>

{% endblock %}
