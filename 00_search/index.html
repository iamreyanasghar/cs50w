<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Google Search</title>
</head>

<body>
   <nav>
      <div>
         <a href="advanced.html">Advance Search</a>
         <a href="image.html">Image Search</a>
      </div>
   </nav>

   <main>
      <section class="logo">
         <img src="img/google.png" alt="Google">
      </section>

      <form action="https://www.google.com/search" method="GET">
         <input type="text" name="q" placeholder="Search Google or type a URL" autocomplete="off">
         <div class="button-group">
            <input class="btn" type="submit" value="Google Search">
            <input class="btn" name="btnI" type="submit" value="I'm Feeling Lucky">
         </div>
      </form>

   </main>
</body>

</html>
